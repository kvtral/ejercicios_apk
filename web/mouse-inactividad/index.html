<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mouse por inactividad</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1d2330; --muted:#667085; --accent:#2563eb; --card:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --fg:#e6e9ef; --muted:#98a2b3; --accent:#60a5fa; --card:#1b2029; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif;
         display:grid; place-items:center; padding:16px; overflow:hidden; }
  .card { background:var(--card); border-radius:12px; padding:20px 24px; max-width:420px; width:100%;
          box-shadow:0 2px 12px rgba(0,0,0,.08); position:relative; z-index:1; }
  h1 { font-size:1.2rem; margin:0 0 12px; }
  label { display:flex; gap:8px; align-items:center; margin:8px 0; }
  input[type=number] { width:70px; }
  .estado { margin-top:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .estado b { color:var(--fg); }
  #cursor { position:fixed; left:0; top:0; width:18px; height:18px; pointer-events:none;
            z-index:2; display:none; transition:transform .8s ease-in-out; }
  #cursor svg { width:100%; height:100%; fill:var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <h1>Mouse por inactividad</h1>
    <label>Segundos sin movimiento: <input id="umbral" type="number" min="1" value="10"></label>
    <label><input id="wakelock" type="checkbox"> Mantener la pantalla encendida (Wake Lock)</label>
    <div class="estado">Estado: <b id="estado">activo</b> · inactivo <b id="contador">0</b> s</div>
  </div>

  <div id="cursor"><svg viewBox="0 0 24 24"><path d="M3 2l7 19 2.5-7.5L20 11z"/></svg></div>

<script>
  // Nota: por seguridad, JavaScript en el navegador NO puede mover el cursor real del sistema.
  // Lo que hacemos es detectar inactividad y animar un cursor "virtual" dentro de la página.
  const umbralInput = document.getElementById('umbral');
  const estadoEl = document.getElementById('estado');
  const contadorEl = document.getElementById('contador');
  const cursor = document.getElementById('cursor');
  const wakeChk = document.getElementById('wakelock');

  let ultimoMovimiento = Date.now();
  let moviendo = null;

  function actividad() {
    ultimoMovimiento = Date.now();
    if (moviendo) {
      clearInterval(moviendo);
      moviendo = null;
      cursor.style.display = 'none';
      estadoEl.textContent = 'activo';
    }
  }
  ['mousemove', 'mousedown', 'keydown', 'touchstart', 'wheel'].forEach(ev =>
    window.addEventListener(ev, actividad, { passive: true }));

  function moverCursorVirtual() {
    const x = Math.random() * (window.innerWidth - 20);
    const y = Math.random() * (window.innerHeight - 20);
    cursor.style.transform = `translate(${x}px, ${y}px)`;
  }

  setInterval(() => {
    const inactivo = Math.floor((Date.now() - ultimoMovimiento) / 1000);
    contadorEl.textContent = inactivo;
    const umbral = Math.max(1, Number(umbralInput.value) || 10);
    if (inactivo >= umbral && !moviendo) {
      estadoEl.textContent = 'inactivo → moviendo cursor';
      cursor.style.display = 'block';
      moverCursorVirtual();
      moviendo = setInterval(moverCursorVirtual, 1500);
    }
  }, 250);

  // Wake Lock: evita que la pantalla se apague mientras la pestaña esté visible.
  let wakeLock = null;
  async function pedirWakeLock() {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (e) {
      wakeChk.checked = false;
      alert('Wake Lock no disponible: ' + e.message);
    }
  }
  wakeChk.addEventListener('change', () => {
    if (!('wakeLock' in navigator)) { wakeChk.checked = false; alert('Tu navegador no soporta Wake Lock.'); return; }
    if (wakeChk.checked) pedirWakeLock(); else if (wakeLock) wakeLock.release();
  });
  document.addEventListener('visibilitychange', () => {
    if (wakeChk.checked && !wakeLock && document.visibilityState === 'visible') pedirWakeLock();
  });
</script>
</body>
</html>
